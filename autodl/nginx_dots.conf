user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	# 全局文件上传大小限制
	client_max_body_size 500M;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

	# 监听6006端口的服务器配置
	server {
		listen 6006;
		server_name _;

		# 处理根路径的静态资源请求（用于Gradio主题文件等）
		location ~ ^/(theme\.css|favicon\.ico|manifest\.json)$ {
			proxy_pass http://127.0.0.1:7860$request_uri;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# 处理Gradio静态资源（字体、图片等）
		location /static/ {
			proxy_pass http://127.0.0.1:7860/static/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# 处理Gradio API请求（文件上传等）
		location /gradio_api/ {
			proxy_pass http://127.0.0.1:7860/gradio_api/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			
			# 处理文件上传需要的设置
			client_max_body_size 100M;
			proxy_request_buffering off;
			proxy_connect_timeout 60s;
			proxy_send_timeout 60s;
			proxy_read_timeout 60s;
		}

		# 路由规则1: /dots/gradio/xxxx -> 7860端口
		location /dots/gradio/ {
			proxy_pass http://127.0.0.1:7860/;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			
			# 处理WebSocket连接
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			
			# 处理文件上传需要的设置
			client_max_body_size 500M;
			proxy_request_buffering off;
			
			# 增加超时时间
			proxy_connect_timeout 60s;
			proxy_send_timeout 60s;
			proxy_read_timeout 60s;
		}

		# 方案1: 直接转发到vLLM根路径 (推荐)
		# 路由规则2: /dots/vllm/xxxx -> 8000端口 (vLLM服务)
		# location /dots/vllm/ {
		# 	# 去掉/dots/vllm前缀，直接转发到vLLM服务
		# 	proxy_pass http://127.0.0.1:8000/;
		# 	proxy_set_header Host 127.0.0.1:8000;
		# 	proxy_set_header X-Real-IP 127.0.0.1;
		# 	proxy_set_header X-Forwarded-For "";
		# 	proxy_set_header X-Forwarded-Proto http;
			
		# 	# 处理长时间推理请求
		# 	proxy_connect_timeout 300s;
		# 	proxy_send_timeout 300s;
		# 	proxy_read_timeout 300s;
		# }
		
		# 方案2: 如果方案1不工作，启用这个配置 (保留/v1前缀)
		# location /dots/vllm/ {
		# 	proxy_pass http://127.0.0.1:8000/v1/;
		# 	proxy_set_header Host 127.0.0.1:8000;
		# 	proxy_set_header X-Real-IP 127.0.0.1;
		# 	proxy_set_header X-Forwarded-For "";
		# 	proxy_set_header X-Forwarded-Proto http;
		# 	
		# 	# 处理长时间推理请求
		# 	proxy_connect_timeout 300s;
		# 	proxy_send_timeout 300s;
		# 	proxy_read_timeout 300s;
		# }
		
		# 方案3: 精确匹配chat/completions路径
		location /dots/vllm/chat/completions {
			proxy_pass http://127.0.0.1:8000/v1/chat/completions;
			proxy_set_header Host 127.0.0.1:8000;
			proxy_set_header X-Real-IP 127.0.0.1;
			proxy_set_header X-Forwarded-For "";
			proxy_set_header X-Forwarded-Proto http;
			
			# 处理长时间推理请求
			proxy_connect_timeout 300s;
			proxy_send_timeout 300s;
			proxy_read_timeout 300s;
		}
	}
}
